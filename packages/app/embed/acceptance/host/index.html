<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed acceptance host</title>
    <!-- The host's own tokens, under the same names the surface once used on
         :root (issue #518, F1). Loading the package must leave them alone. -->
    <style>
      :root {
        --accent: #bd5839;
        --muted: #4b5563;
      }
      /* The host themes its wrapper (issue #523, G5): --tt-muted, which `theme`
         does not set, reaches the surface; --tt-accent, which `theme` does set,
         is overridden by it, as docs/extending/embed-package.md documents. */
      .host-assistant.tt-app-embed {
        --tt-muted: #6b6b6b;
        --tt-accent: #123456;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
