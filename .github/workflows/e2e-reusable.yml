name: E2E (reusable)

# Playwright end-to-end tests: real-browser verification of the code-exec sandbox
# isolation guarantees that jsdom cannot cover (issue #217). Extracted into a
# reusable workflow (issue #254) so both deploy pipelines can run the SAME job:
#   - deploy-pages.yml calls it on PRs (feeds the merged Allure preview report) and
#     on main/develop pushes (gating), and
#   - deploy-edge.yml calls it on its edge-path pushes (gating).
#
# The suite is sharded across a fixed matrix of parallel jobs so it does not become
# the slowest gate as it grows. The three product shells are built ONCE in
# `build-shells` and shared to every shard via the `shells-dist` artifact, so the
# build is not repeated per shard. To add shards later, extend the `shard:` list —
# the `--shard` denominator derives from `strategy.job-total` automatically.
#
# Only LiteLLM is mocked (the real edge worker runs in-process); the run is anonymous
# with rate limiting disabled, so the job needs no secrets. See packages/e2e/README.md.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Build the three product shells once and publish their dist for the shards to
  # serve via `vite preview`. This is the only job that needs a full install (sharp
  # for brand-asset generation during the build).
  build-shells:
    name: Build shells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace
        with:
          install: full

      # Persist Turborepo's local cache across runs so an unchanged build hits cache.
      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.workflow }}-e2e-shells-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.workflow }}-e2e-shells-

      # Build the composed host. The Turbo graph owns brand asset/license/notice
      # generation; privacy policy generation remains an explicit source prerequisite.
      # host#build builds the single shell + integrated stages + the root app and
      # composes them into apps/host/dist (including /web/, /widget/, /mobile/, and
      # /pixel-agents/). The e2e suite serves that composed dist so the three browser
      # endpoints share one origin exactly as deployed, including the integrated apps.
      - name: Build composed host
        run: |
          pnpm generate:privacy-policy
          pnpm exec turbo run build \
            --filter=@tinytinkerer/host

      # The composed host dist is the complete browser surface served by every shard.
      - name: Upload built shells
        uses: actions/upload-artifact@v6
        with:
          name: shells-dist
          path: apps/host/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Playwright (shard ${{ matrix.shard }})
    needs: build-shells
    runs-on: ubuntu-latest
    strategy:
      # Keep every shard's results for the merged report — one shard failing must
      # not cancel the others.
      fail-fast: false
      matrix:
        # Raise this list to add shards; the `--shard` denominator
        # (strategy.job-total) tracks it automatically.
        shard: [1, 2, 3]
    env:
      # Pin the per-run ports so the webServer URLs are deterministic in CI. The three
      # endpoints share ONE origin (E2E_PORT). Shards run on separate runners, so the
      # fixed port never collides.
      E2E_PORT: 43117
      # The merged report combines all shards by test, so the shard boundary is
      # otherwise invisible. playwright.config.ts reads this to tag every test in this
      # shard's process with `shard-<n>`, keeping the merged report filterable by shard
      # (issue #258).
      E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5

      # Scriptless is enough: shards only serve the prebuilt static `dist` via
      # `vite preview` and run Playwright — no native binaries needed.
      - uses: ./.github/actions/setup-workspace
        with:
          install: scriptless

      # Cache the Playwright browser binaries, keyed by the pinned @playwright/test
      # version AND the browser set, so the downloads are fetched at most once per
      # bump. The `-cfw` suffix (chromium+firefox+webkit) invalidates the old
      # chromium-only cache when the engine set changes (issue #245).
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./packages/e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-cfw

      # The `playwright` package's postinstall is blocked by the supply-chain
      # policy (allowBuilds: playwright: false), so fetch browsers explicitly here. On a
      # cache hit, still install the OS libraries (not part of the cached path).
      # WebKit on Linux needs extra system libraries; `--with-deps` pulls them in.
      # Every shard installs all three engines because Playwright's --shard splits
      # tests across shards, so any shard may receive a firefox/webkit test.
      - name: Install browsers (Chromium + Firefox + WebKit, + OS deps)
        run: pnpm --filter @tinytinkerer/e2e exec playwright install --with-deps chromium firefox webkit

      # upload-artifact stores the contents of the single uploaded directory at the
      # artifact root, so restore them directly where `vite preview` expects them.
      - name: Download built shells
        uses: actions/download-artifact@v7
        with:
          name: shells-dist
          path: apps/host/dist

      # `maxFailures` (playwright.config.ts) bails this shard once a few tests fail so a
      # single cascading root cause doesn't run the whole reddened shard. It is PER SHARD,
      # so the effective budget is the per-shard value × the shard count; the default is 3
      # per shard. Tune it here by setting E2E_MAX_FAILURES (0 = unbounded). When a shard
      # bails, the bail-warning reporter annotates this job with the tests it skipped.
      - name: Run Playwright e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: pnpm --filter @tinytinkerer/e2e e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Upload this shard's Allure results even when the suite fails, so the PR
      # preview report can still surface the failures (issue #254). A failed suite
      # already reds the step/job above; this just preserves the inputs. Result
      # files are UUID-named, so the report job merges all shards' results safely.
      - name: Upload Allure results (e2e shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-e2e-${{ matrix.shard }}
          path: packages/e2e/allure-results
          if-no-files-found: warn
          retention-days: 1

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 1
